name: Deploy Onchain visual review preview

on:
  push:
    branches:
      - onchain-landing-redesign-preview

permissions:
  contents: write

concurrency:
  group: onchain-visual-review-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/firebase-service-account.json','utf8'));if(!a.client_email||!a.private_key)process.exit(1);console.log('Preview deploy identity configured.')"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy isolated Firebase Hosting preview (7 days)
        run: firebase hosting:channel:deploy onchain-review --project onchaincrypto-d976b --expires 7d --non-interactive

      - name: Publish the temporary preview link to the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW_URL="$(firebase hosting:channel:open onchain-review --project onchaincrypto-d976b 2>&1 | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::Firebase deployed, but the preview URL could not be retrieved."
            exit 1
          fi
          printf '%s\n' "$PREVIEW_URL" > preview-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-url.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish temporary visual preview link"
            git push
          fi
          echo "## Onchain visual preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
