name: Frontend smoke checks

on:
  push:
    paths:
      - "public/**"
      - "tests/public-html-smoke.test.mjs"
      - ".github/workflows/frontend-smoke.yml"
  pull_request:
    paths:
      - "public/**"
      - "tests/public-html-smoke.test.mjs"
      - ".github/workflows/frontend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse inline scripts and check key page elements
        run: node --test tests/public-html-smoke.test.mjs
