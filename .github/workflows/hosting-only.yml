name: Deploy Firebase Hosting only

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only one Hosting deployment may run at a time. Newer commits replace older pending runs.
concurrency:
  group: onchaincrypto-firebase-hosting
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy website and Firestore security rules only (no Functions or API enablement)
        run: firebase deploy --project onchaincrypto-d976b --only hosting,firestore:rules --non-interactive
