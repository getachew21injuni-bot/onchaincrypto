name: Deploy OnChainSpro Firebase Hosting only

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Hosting-only release. Never deploy the wallet Worker, Cloud Functions, or Firestore rules/indexes here.
concurrency:
  group: onchaincrypto-firebase-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test website HTML and JavaScript
        run: node --test tests/public-html-smoke.test.mjs

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Diagnose Firebase service-account identity
        run: |
          node -e 'const fs = require("node:fs"); const p = process.env.GOOGLE_APPLICATION_CREDENTIALS; const c = JSON.parse(fs.readFileSync(p, "utf8")); if (!c.client_email) { console.error("Credential JSON has no client_email."); process.exit(1); } console.log("Firebase credential client_email: " + c.client_email); console.log("Firebase credential project_id: " + (c.project_id || "(not set)"));'

      - name: Deploy Firebase Hosting only
        run: firebase deploy --project onchaincrypto-d976b --only hosting --non-interactive

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
