name: Deploy OnChainSpro wallet Worker, Firebase Hosting, and Firestore

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One ordered release: deploy the wallet API before publishing the frontend that calls it.
concurrency:
  group: onchaincrypto-firebase-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test website HTML and JavaScript
        run: node --test tests/public-html-smoke.test.mjs

      - name: Install Cloudflare Wrangler
        run: npm install --global wrangler@4

      - name: Configure the staged wallet Worker service-account secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing Cloudflare deployment credentials."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | wrangler secret put FIREBASE_SERVICE_ACCOUNT --config workers/onchainspro-wallet-api-v2/wrangler.toml

      - name: Deploy the staged OnChainSpro wallet API v2 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            if wrangler deploy --config workers/onchainspro-wallet-api-v2/wrangler.toml; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Cloudflare deploy did not complete (attempt $attempt). Retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "Cloudflare Worker deploy failed after 3 attempts. Firebase Hosting was not deployed."
          exit 1

      - name: Verify the deployed wallet Worker version
        run: |
          response="$(curl --fail --silent --show-error https://onchainspro-wallet-api-v2.getachew21-inj-uni.workers.dev/health)"
          echo "$response"
          echo "$response" | grep -q '"mode":"wallet-api-v2-server-trades"'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate with Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_ONCHAINCRYPTO."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting, Firestore rules, and indexes
        run: firebase deploy --project onchaincrypto-d976b --only hosting,firestore:rules,firestore:indexes --non-interactive
