name: Wallet API and backend checks

on:
  push:
    paths:
      - "workers/wallet-api/**"
      - "tests/wallet-api-*.test.mjs"
      - "tests/firestore-rest.test.mjs"
      - "package.json"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "workers/wallet-api/**"
      - "tests/wallet-api-*.test.mjs"
      - "tests/firestore-rest.test.mjs"
      - "package.json"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run isolated wallet API tests
        run: npm run test:wallet-api
